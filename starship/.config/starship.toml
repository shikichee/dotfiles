add_newline = false
format = """
${custom.worktree}[${directory} ](bold blue)${git_branch}${git_status}[\\$ ](white)
"""

[custom.worktree]
command = "basename $(pwd | grep -o '.claude/worktrees/[^/]*' || echo '')"
when = "pwd | grep -q '.claude/worktrees/'"
format = "[🌳 $output ](bold green)"
[directory]
truncation_length = 3
truncate_to_repo = false
fish_style_pwd_dir_length = 2
style = "bold blue"
[git_branch]
format = "[\\(](bold cyan)[$branch](bold red)"
[git_status]
format = "[$modified]($style)[\\)](bold cyan) "
style = "bold yellow"
modified = " ✗"
